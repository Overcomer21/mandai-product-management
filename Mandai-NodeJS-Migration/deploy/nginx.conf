
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format mandai_lb
        '$remote_addr "$request" '
        'status=$status '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    # ---------------------------------------------------------
    # Flutter Web CORS - Local Development
    # ---------------------------------------------------------

    # Allow only known Flutter development origins.
    map $http_origin $flutter_cors_origin {
        default "";
        "http://127.0.0.1:8085" $http_origin;
        "http://localhost:8085" $http_origin;
    }

    # ---------------------------------------------------------
    # Product Catalog Load Balancer
    # ---------------------------------------------------------

    upstream catalog_backend {
        least_conn;

        server catalog1:8011 max_fails=3 fail_timeout=10s;
        server catalog2:8011 max_fails=3 fail_timeout=10s;
        server catalog3:8011 max_fails=3 fail_timeout=10s;
        server catalog4:8011 max_fails=3 fail_timeout=10s;
    }

    # ---------------------------------------------------------
    # Commerce Load Balancer
    # ---------------------------------------------------------

    upstream commerce_backend {
        least_conn;

        server commerce1:8011 max_fails=3 fail_timeout=10s;
        server commerce2:8011 max_fails=3 fail_timeout=10s;
    }

    # ---------------------------------------------------------
    # Identity Service
    # ---------------------------------------------------------

    upstream identity_backend {
        server identity:8011;
    }

    # ---------------------------------------------------------
    # Admin Service
    # ---------------------------------------------------------

    upstream admin_backend {
        server admin:8011;
    }

    # ---------------------------------------------------------
    # HTTP Gateway
    # ---------------------------------------------------------

    server {
        listen 8080;
        server_name _;

        client_max_body_size 2m;

        access_log /var/log/nginx/mandai-access.log mandai_lb;
        error_log /var/log/nginx/mandai-error.log warn;

        # -----------------------------------------------------
        # Proxy Settings
        # -----------------------------------------------------

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        # -----------------------------------------------------
        # Flutter Web CORS
        # -----------------------------------------------------

        add_header Access-Control-Allow-Origin
            $flutter_cors_origin always;

        add_header Access-Control-Allow-Methods
            "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, Idempotency-Key" always;

        add_header Access-Control-Max-Age
            "86400" always;

        add_header Vary "Origin" always;

        # Handle browser CORS preflight requests.
        # Return before forwarding OPTIONS to backend services.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # -----------------------------------------------------
        # Product Images and Media
        # -----------------------------------------------------

        location ^~ /media/ {
            alias /srv/mandai/media/;
            try_files $uri =404;

            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;

            expires 1h;
        }

        # -----------------------------------------------------
        # Health Check
        # -----------------------------------------------------

        location = /health {
            proxy_pass http://catalog_backend;
        }

        # -----------------------------------------------------
        # Product Catalog Service
        # -----------------------------------------------------

        location /api/products {
            proxy_pass http://catalog_backend;
        }

        # -----------------------------------------------------
        # Admin Service
        # -----------------------------------------------------

        location /api/admin/ {
            proxy_pass http://admin_backend;
        }

        # -----------------------------------------------------
        # Identity and Authentication
        # -----------------------------------------------------

        location /api/auth/ {
            proxy_pass http://identity_backend;
        }

        location /api/account/ {
            proxy_pass http://identity_backend;
        }

        # -----------------------------------------------------
        # Commerce Service
        # -----------------------------------------------------

        location /api/ {
            proxy_pass http://commerce_backend;
        }

        # -----------------------------------------------------
        # Unknown Routes
        # -----------------------------------------------------

        location / {
            return 404;
        }
    }
}
