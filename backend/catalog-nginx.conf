
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    log_format catalog_lb
        '$remote_addr "$request" '
        'status=$status '
        'upstream=$upstream_addr '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    map $http_origin $mandai_flutter_cors {
        default "";
        "http://127.0.0.1:8085" $http_origin;
        "http://localhost:8085" $http_origin;
    }

    upstream catalog_backend {
        least_conn;
        server host.docker.internal:8100 max_fails=30 fail_timeout=5s;
        server host.docker.internal:8101 max_fails=30 fail_timeout=5s;
        server host.docker.internal:8102 max_fails=30 fail_timeout=5s;
        server host.docker.internal:8103 max_fails=30 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8080;

        add_header Access-Control-Allow-Origin $mandai_flutter_cors always;
        add_header Vary "Origin" always;

        access_log /dev/stdout catalog_lb;
        error_log /dev/stderr warn;

        location /media/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Vary;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/auth/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        location /api/admin/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        location /api/stripe-checkout/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        location /api/stripe-test/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        location /api/payment-return/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        location /api/orders/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        location /api/checkout {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
        }

        # Health Check - Main FastAPI
        location = /health {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location / {
            proxy_pass http://catalog_backend;

            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 4;
            proxy_next_upstream_timeout 5s;

            proxy_set_header Connection "";
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
