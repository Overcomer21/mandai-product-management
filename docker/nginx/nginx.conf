
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================
    # NGINX Access Logging
    # =========================================================

    log_format mandai_lb
        '$remote_addr "$request" '
        'status=$status '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time';

    # =========================================================
    # FastAPI Backend Load Balancing
    # =========================================================

    upstream mandai_backend {
        least_conn;

        server host.docker.internal:8001
            max_fails=3 fail_timeout=10s;

        server host.docker.internal:8002
            max_fails=3 fail_timeout=10s;

        server host.docker.internal:8003
            max_fails=3 fail_timeout=10s;

        server host.docker.internal:8004
            max_fails=3 fail_timeout=10s;
    }

    # =========================================================
    # HTTP Reverse Proxy
    # =========================================================

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/mandai-access.log mandai_lb;
        error_log /var/log/nginx/mandai-error.log warn;

        # =====================================================
        # FastAPI Routes
        # =====================================================

        location / {
            proxy_pass http://mandai_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Connection / Response Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Upstream Failover
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
        }
    }
}
