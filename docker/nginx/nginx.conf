# Mandai Node.js candidate gateway. Separate from existing FastAPI gateway.
worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format mandai_lb '$remote_addr "$request" status=$status '
        'upstream=$upstream_addr upstream_status=$upstream_status '
        'request_time=$request_time upstream_time=$upstream_response_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time';

    upstream catalog_backend { least_conn; server catalog1:8000 max_fails=3 fail_timeout=10s; server catalog2:8000 max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream commerce_backend { least_conn; server commerce1:8000 max_fails=3 fail_timeout=10s; server commerce2:8000 max_fails=3 fail_timeout=10s; keepalive 16; }
    upstream identity_backend { server identity:8000; keepalive 8; }
    upstream admin_backend { server admin:8000; keepalive 8; }

    server {
        listen 8080;
        server_name _;
        access_log /var/log/nginx/mandai-node-access.log mandai_lb;
        error_log /var/log/nginx/mandai-node-error.log warn;
        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Never explicitly retry non-idempotent requests; preserve payment safety.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        location = /health { proxy_pass http://catalog_backend; }
        location = /api/products { proxy_pass http://catalog_backend; }
        location ^~ /api/products/ { proxy_pass http://catalog_backend; }
        location ^~ /api/admin/ { proxy_pass http://admin_backend; }
        location ^~ /api/auth/ { proxy_pass http://identity_backend; }
        location ^~ /api/account/ { proxy_pass http://identity_backend; }
        location ^~ /api/ { proxy_pass http://commerce_backend; }
        location / { return 404 '{"detail":"Not Found"}'; add_header Content-Type application/json always; }
    }
}
